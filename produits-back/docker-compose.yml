version: '3.8'

services:
  produits-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payetonkawa-produits-api
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DB_HOST=produits-db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_DATABASE=produits_db
      - JWT_SECRET=your-jwt-secret-key
      - RABBITMQ_URL=amqp://guest:guest@payetonkawa-rabbitmq:5672
    depends_on:
      - produits-db
    networks:
      - payetonkawa-network
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  produits-db:
    image: postgres:15-alpine
    container_name: payetonkawa-produits-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: produits_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - produits_db_data:/var/lib/postgresql/data

    networks:
      - payetonkawa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  produits_db_data:
    driver: local

networks:
  payetonkawa-network:
    external: true 