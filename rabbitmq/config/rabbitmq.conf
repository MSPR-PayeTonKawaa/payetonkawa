# ===========================================
# RABBITMQ CONFIGURATION - PAYETONKAWA
# ===========================================

# Logging
log.console = true
log.console.level = info
log.file = false

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
management.load_definitions = /etc/rabbitmq/definitions.json

# Network and performance
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0

# Memory and disk
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Heartbeat
heartbeat = 60

# Default user (overridden by environment variables)
default_vhost = /payetonkawa
default_user = payetonkawa
default_pass = rabbitmq123
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Cluster settings (for future scaling)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = payetonkawa-rabbitmq@payetonkawa-rabbitmq

# Queue settings
queue_master_locator = min-masters

# Security
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN

# SSL (disabled for development)
listeners.ssl = none

# Prometheus metrics (for monitoring)
prometheus.tcp.port = 15692 