version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payetonkawa-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=payetonkawa-jwt-secret-2024
      - CLIENTS_API_URL=http://payetonkawa-clients-api:3000
      - PRODUITS_API_URL=http://payetonkawa-produits-api:3000
      - COMMANDES_API_URL=http://payetonkawa-commandes-api:3000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    # depends_on:
    #   - rabbitmq
    networks:
      - payetonkawa-network
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: payetonkawa-rabbitmq
    ports:
      - "5673:5672"   # AMQP port
      - "15673:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - payetonkawa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring with Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: payetonkawa-grafana
    ports:
      - "3010:3000"  # Port différent pour éviter conflit avec gateway
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - payetonkawa-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: payetonkawa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - payetonkawa-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  payetonkawa-network:
    external: true 