name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job pour déployer les images Docker
  deploy:
    name: Build and Push Images
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine tag
      id: tag
      run: |
        if [[ ${{ github.ref }} == refs/tags/* ]]; then
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "ENV=production" >> $GITHUB_OUTPUT
        else
          echo "TAG=latest" >> $GITHUB_OUTPUT
          echo "ENV=development" >> $GITHUB_OUTPUT
        fi

    - name: Build and push API Gateway image
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        file: ./api-gateway/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:${{ steps.tag.outputs.TAG }}

    - name: Build and push Clients Service image
      uses: docker/build-push-action@v5
      with:
        context: ./clients-back
        file: ./clients-back/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/clients-back:${{ steps.tag.outputs.TAG }}

    - name: Build and push Produits Service image
      uses: docker/build-push-action@v5
      with:
        context: ./produits-back
        file: ./produits-back/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/produits-back:${{ steps.tag.outputs.TAG }}

    - name: Build and push Commandes Service image
      uses: docker/build-push-action@v5
      with:
        context: ./commandes-back
        file: ./commandes-back/Dockerfile
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/commandes-back:${{ steps.tag.outputs.TAG }}
