sonar.projectKey=MSPR-PayeTonKawaa_payetonkawa
sonar.organization=mspr-payetonkawaa

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=PayeTonKawa
sonar.projectVersion=1.0.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=api-gateway/src,clients-back/src,produits-back/src,commandes-back/src

# Test sources
sonar.tests=api-gateway/src,clients-back/src,produits-back/src,commandes-back/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/test/**/*.ts

# Coverage reports
sonar.typescript.lcov.reportPaths=api-gateway/coverage/lcov.info,clients-back/coverage/lcov.info,produits-back/coverage/lcov.info,commandes-back/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test/**/*.ts

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.typescript.node=true
